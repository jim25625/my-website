      <section class="hero case-hero">
        <h1>车型品牌传播</h1>
        <p class="case-subtitle">格瑞维亚引进中国市场上市及后续改款整合传播</p>
      </section>

      <section class="desc case-intro">
        <p>
          Granvia格瑞维亚，是一汽丰田引入的一款大七座MPV车型，源于北美的Sienna运动版，与广汽丰田的塞那同源。作为一个新的汽车品牌，如何让市场熟知并接受是传播的主要目的。
        </p>
        <p>
          经过上市传播战役以及后续的小改款传播战役，成功使格瑞维亚成为MPV市场里的主要品牌，在销售上超越传统MPV霸主GL8，与赛那联手成为该细分市场的领头羊。
        </p>
      </section>
