        <h2>金标大众店头活动企划/传播</h2>
      </section>

      <section class="desc case-intro">
        <p>
          金标大众面临较大的销售压力，为激活店头触点，提升集客能力，我们企划了一系列活动，父亲节活动是其中之一。父亲节活动我们以“爸气‘T’你说”为主题，采用亲子家庭容易接受又成本不高的“T恤创意彩绘”活动形式，打造亲子互动沉浸体验，并辅以“小蜜蜂”在商场周边扩大人群接触面，活动期间销售线索量、试驾量均大幅提高，同时通过社交媒体热点传播进一步扩大了品牌与活动影响面。
        </p>
